<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدراع بايظ — جيلبريك 13.02 حتى 13.52</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%;
               background: linear-gradient(160deg,#0b0d10 55%,#16110a 100%);
               color:#c8ced8;
               font:16px/1.7 "Segoe UI", Tahoma, system-ui, sans-serif; }
  #brand { text-align:center; padding:9px 12px; background:#0e1116;
           border-bottom:1px solid #1e2732;
           display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #brand .brand-center { display:inline-flex; align-items:center; gap:8px; flex:1; justify-content:center; min-width:0; }
  #brand img { width:28px; height:28px; border-radius:50%; flex:none; }
  #backlink { background:linear-gradient(135deg,#f0d060,#d4af37); color:#141005;
              font-weight:800; text-decoration:none; border-radius:8px;
              padding:7px 14px; font-size:13px; white-space:nowrap; flex:none;
              letter-spacing:.3px; }
  #backlink:hover { filter:brightness(1.08); }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.05em; color:#d4af37; }
  .dev { font-size:11px; opacity:.65; color:#d4af37; letter-spacing:.5px; font-weight:500; }

  /* ====== بطاقة مركزية ====== */
  #hero { max-width:560px; margin:9vh auto 0; padding:0 18px; }
  .panel { background:rgba(17,21,27,.92); border:1px solid #2b3542; border-radius:16px;
           padding:26px 24px 22px; text-align:center;
           box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .panel .ring { width:88px; height:88px; margin:0 auto 14px; border-radius:50%;
           padding:5px; border:2px solid #d4af37;
           background:#0b0d10; position:relative; }
  .panel .ring img { width:100%; height:100%; border-radius:50%; display:block; }
  .panel .ring::after { content:""; position:absolute; inset:-7px; border-radius:50%;
           border:2px solid rgba(212,175,55,.28);
           animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%{transform:scale(1);opacity:.9} 70%{transform:scale(1.12);opacity:0} 100%{opacity:0} }
  h1 { color:#e8d090; font-size:21px; margin:0 0 4px; font-weight:800; }
  .fwline { color:#8b95a3; font-size:13px; margin:0 0 14px; }
  .fwline b { color:#d4af37; direction:ltr; unicode-bidi:embed; }

  #state { font-size:19px; font-weight:800; margin:0 0 8px; color:#e6ebf2; min-height:29px; }
  #state.ok { color:#7fd0a0; } #state.bad { color:#e08a7f; } #state.warn { color:#e0c77b; }
  #det { font-size:13.5px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; direction:ltr; unicode-bidi:embed; }
  #cache { font-size:12.5px; color:#5c6672; margin:0 0 14px; min-height:19px; }
  #cache.cacheok { color:#7fd0a0; }

  .xbtn { display:inline-flex; align-items:center; justify-content:center; gap:10px;
          background:linear-gradient(135deg,#f0d060,#d4af37); color:#141005;
          font-weight:900; font-size:18px; border-radius:12px;
          padding:13px 30px; letter-spacing:.5px; direction:rtl;
          animation:breathe 1.9s ease-in-out infinite; }
  .xbtn .kx { display:inline-flex; align-items:center; justify-content:center;
          width:30px; height:30px; border-radius:8px; background:#141005; color:#f0d060;
          font-size:16px; font-weight:900; }
  @keyframes breathe { 0%,100%{transform:scale(1);box-shadow:0 4px 18px rgba(212,175,55,.35)}
                       50%{transform:scale(1.035);box-shadow:0 6px 26px rgba(212,175,55,.55)} }
  .hint { font-size:12px; color:#5c6672; margin:12px 0 0; }
  .bar { height:6px; border-radius:99px; background:#1a212b; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; width:0%; border-radius:99px;
           background:linear-gradient(90deg,#d4af37,#f0d060); transition:width .3s; }
  #wrap .tags { margin-top:14px; }
  .tag { display:inline-block; background:#1a2330; border:1px solid #2b3542; color:#aab4c0;
         border-radius:99px; padding:3px 12px; font-size:11.5px; margin:2px; }
</style>
</head>
<body>
<div id="brand"><a id="backlink" href="../index.html" onclick="event.stopPropagation()" onkeydown="if(event.target===this)event.stopPropagation()">&#10148; رجوع للرئيسية</a><span class="brand-center"><img src="../logo.png" alt="" width="28" height="28"><b>الدراع بايظ</b> <span class="dev">by H0sS</span></span><span style="flex:none;width:1px"></span></div>
<div id="wrap">
  <div id="hero">
    <div class="panel">
      <div class="ring"><img src="../logo.png" alt="" width="78" height="78"></div>
      <h1>جيلبريك PS4 — GoldHEN</h1>
      <p class="fwline">السلسلة المدعومة: <b>13.02 · 13.04 · 13.50 · 13.52</b></p>
      <div id="state">جارٍ اكتشاف إصدار النظام...</div>
      <div id="det"></div>
      <div id="cache"></div>
      <div class="bar"><i id="barfill"></i></div>
      <div id="presswrap">
        <span class="xbtn"><span class="kx">✕</span> اضغط زر X للتشغيل</span>
        <p class="hint">أو المس الشاشة / اضغط أي زر بالماوس</p>
      </div>
      <div class="tags">
        <span class="tag">WebKit + Kernel</span>
        <span class="tag">GoldHEN 2.4b18</span>
        <span class="tag">باتشات AIO Fix</span>
        <span class="tag">يشتغل أوفلاين بعد أول مرة</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var barfill = document.getElementById("barfill");
    var presswrap = document.getElementById("presswrap");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function setBar(p) { if (barfill) barfill.style.width = (p ? p : 0) + "%"; }
    function hidePress() { if (presswrap) presswrap.style.display = "none"; }
    function showPress() { if (presswrap) presswrap.style.display = ""; }
    hidePress();
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = (key ? "إصدار جهازك: <b>" + key + "</b> — "
                            : "إصدار الجهاز غير معروف — ")
        + (supported ? "<b style=\"color:#7fd0a0\">مدعوم بالكامل ✅</b>"
                     : "غير مدرج في جدول السلسلة دي");

    var target = "jb.html" + location.search;
    function go() {
        setState("جارٍ فتح صفحة التشغيل...", "warn");
        hidePress();
        setBar(30);
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        showPress();
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("⚠️ الإصدار غير مدعوم في السلسلة دي", "bad");
        waitForTap("اضغط X أو المس الشاشة للتشغيل على مسؤوليتك", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setBar(60);
        go();
    } else if (!navigator.onLine) {
        setCache("وضع بدون إنترنت — شغّال من الكاش المحفوظ ✅", true);
        setBar(100);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("الكاش جاهز — هتشتغل عادي من غير نت ✅", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("نزل تحديث جديد للموقع ✅", true);
        waitForTap("في تحديث جديد — اضغط X أو المس الشاشة للتحديث والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جارٍ فحص الكاش...");
        ac.addEventListener("downloading",
            function () { setCache("جارٍ حفظ الصفحة للعمل بدون إنترنت (أول مرة)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var p = Math.round((e.loaded / e.total) * 100);
                setCache("جارٍ الحفظ... " + p + "%");
                setBar(p);
            }
        }, false);
        ac.addEventListener("cached", function () {
            setCache("اتحفظ كامل — المرة الجاية مش هتحتاج إنترنت ✅", true);
            setBar(100);
            waitForTap("تم الحفظ — اضغط X أو المس الشاشة لبدء الجيلبريك", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("نزل تحديث جديد للموقع ✅", true);
            waitForTap("في تحديث جديد — اضغط X أو المس الشاشة للتحديث والتشغيل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("الكاش جاهز — هتشتغل عادي من غير نت ✅", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("الكاش مش متاح دلوقتي");
            waitForTap("فحص الكاش فشل — اضغط X أو المس الشاشة للتشغيل على أي حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("النسخة المحفوظة قديمة");
            waitForTap("الكاش قديم — اضغط X أو المس الشاشة للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
